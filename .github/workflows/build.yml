name: Build Guard Hero Browser

on:
  push:
    branches:
      - main
      - "release/*"
  pull_request:
    branches:
      - main
  schedule:
    # Weekly rebase check — Monday 02:00 UTC
    - cron: "0 2 * * 1"
  workflow_dispatch:
    inputs:
      force_build:
        description: "Force full build even without source changes"
        required: false
        default: "false"

env:
  GH_VERSION: "1.0.0"
  CHROMIUM_TARGET: "x64"
  GN_ARGS: >-
    is_official_build=true
    is_debug=false
    target_cpu="x64"
    enable_guardhero=true
    enable_eagleeye_native=true
    proprietary_codecs=true
    ffmpeg_branding="Chrome"

jobs:
  # ─────────────────────────────────────────────
  # Windows build (self-hosted runner required)
  # ─────────────────────────────────────────────
  build-windows:
    name: Build — Windows x64
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 300
    if: github.event_name != 'schedule'

    steps:
      - name: Checkout Guard Hero repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache depot_tools
        uses: actions/cache@v4
        with:
          path: C:\depot_tools
          key: depot-tools-${{ runner.os }}-${{ hashFiles('DEPS') }}

      - name: Install depot_tools
        shell: pwsh
        run: |
          if (-not (Test-Path C:\depot_tools)) {
            git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git C:\depot_tools
          }
          echo "C:\depot_tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Sync Chromium source
        shell: cmd
        run: |
          set DEPOT_TOOLS_WIN_TOOLCHAIN=0
          gclient sync --with_branch_heads --with_tags --jobs=16

      - name: Apply Guard Hero patches
        shell: cmd
        run: python build\apply_gh_patches.py --stop-on-error

      - name: Build browser-ui assets
        shell: cmd
        run: |
          cd browser-ui
          npm ci
          npm run build

      - name: Configure GN build
        shell: cmd
        run: |
          set DEPOT_TOOLS_WIN_TOOLCHAIN=0
          gn gen out\Release "--args=%GN_ARGS%"

      - name: Build Chrome (autoninja)
        shell: cmd
        run: autoninja -C out\Release chrome

      - name: Run unit tests
        shell: cmd
        run: |
          autoninja -C out\Release unit_tests
          out\Release\unit_tests.exe --gtest_filter=GuardHero*

      - name: Package Windows installer
        shell: pwsh
        run: .\build\windows\make_installer.ps1

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: GuardHeroBrowser-Windows-x64-${{ github.sha }}
          path: |
            installer/windows/GuardHeroBrowser-Setup-x64.exe
          retention-days: 30

  # ─────────────────────────────────────────────
  # macOS build (self-hosted Apple Silicon runner)
  # ─────────────────────────────────────────────
  build-macos:
    name: Build — macOS arm64
    runs-on: [self-hosted, macos, arm64]
    timeout-minutes: 300
    if: github.event_name != 'schedule'

    steps:
      - name: Checkout Guard Hero repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install depot_tools
        run: |
          if [ ! -d "$HOME/depot_tools" ]; then
            git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git "$HOME/depot_tools"
          fi
          echo "$HOME/depot_tools" >> "$GITHUB_PATH"

      - name: Sync Chromium source
        run: gclient sync --with_branch_heads --with_tags --jobs=16

      - name: Apply Guard Hero patches
        run: python3 build/apply_gh_patches.py --stop-on-error

      - name: Build browser-ui assets
        run: |
          cd browser-ui
          npm ci
          npm run build

      - name: Configure GN build (Universal)
        run: |
          gn gen out/Release --args='
            is_official_build=true
            is_debug=false
            enable_guardhero=true
            enable_eagleeye_native=true
            proprietary_codecs=true
            ffmpeg_branding="Chrome"
            target_cpu="arm64"
          '

      - name: Build Chrome
        run: autoninja -C out/Release chrome

      - name: Run unit tests
        run: |
          autoninja -C out/Release unit_tests
          ./out/Release/unit_tests --gtest_filter=GuardHero*

      - name: Create macOS DMG
        run: bash installer/macos/create_dmg.sh

      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool submit \
            "installer/macos/GuardHeroBrowser.dmg" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait

      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: GuardHeroBrowser-macOS-arm64-${{ github.sha }}
          path: installer/macos/GuardHeroBrowser.dmg
          retention-days: 30

  # ─────────────────────────────────────────────
  # Rebase check — runs on schedule and PRs
  # ─────────────────────────────────────────────
  rebase-check:
    name: Rebase Check — Chromium Upstream
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check for new Chromium stable
        id: upstream_check
        run: |
          python3 build/check_upstream.py
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Alert team if behind
        if: steps.upstream_check.outcome == 'failure'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python3 build/notify_team.py

      - name: Fail job if behind (blocks merge)
        if: steps.upstream_check.outcome == 'failure' && github.event_name == 'pull_request'
        run: |
          echo "::error::Guard Hero is behind Chromium stable. Rebase required before merging."
          exit 1
